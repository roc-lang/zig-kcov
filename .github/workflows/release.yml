name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14
            target: aarch64-macos
            artifact: kcov-aarch64-macos
          - os: macos-13
            target: x86_64-macos
            artifact: kcov-x86_64-macos
          - os: ubuntu-latest
            target: x86_64-linux
            artifact: kcov-x86_64-linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.15.2

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdwarf-dev libcurl4-openssl-dev zlib1g-dev pkg-config

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install libdwarf pkg-config

      - name: Build kcov
        run: zig build -Doptimize=ReleaseFast

      - name: Codesign (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign -s - --entitlements osx-entitlements.xml -f zig-out/bin/kcov

      - name: Create tarball
        run: |
          mkdir -p dist
          cp zig-out/bin/kcov dist/
          cp osx-entitlements.xml dist/ 2>/dev/null || true
          tar -czvf ${{ matrix.artifact }}.tar.gz -C dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
